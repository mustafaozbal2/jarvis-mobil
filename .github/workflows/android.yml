name: JARVIS Mobil APK

# Her "push"ta ve elle tetikleyince APK derler. Android Studio gerekmez.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle'ı hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle (release)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          # İstersen depo ayarlarında "JARVIS_KEYSTORE_SIFRE" adlı gizli değer tanımla; yoksa varsayılan kullanılır.
          JARVIS_KEYSTORE_SIFRE: ${{ secrets.JARVIS_KEYSTORE_SIFRE }}

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mobil-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
